[pytest]
# unit tests live in tests/ and must be isolated (no network, no model loads,
# no writes outside tmp_path). anything needing a real gguf or the embedding
# model is marked `heavy` and skipped by default; run with `-m heavy` to include.
# asyncio_mode=auto lets the async route/integration tests run without a marker.
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_functions = test_*
addopts = -q --strict-markers
markers =
    heavy: tests that load real models or hit the network (deselected by default)
