name: Build & Release Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_NAME: ThinkStack
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
          - os: macos-latest
            target: universal-apple-darwin
            label: macos-universal
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      # ── checkout ──
      - uses: actions/checkout@v4

      # ── system dependencies (linux only) ──
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpango1.0-dev \
            build-essential

      # ── python ──
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
        shell: bash

      # ── node ──
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          npm install
          npm --prefix frontend install
        shell: bash

      # ── rust ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── build frontend ──
      - name: Build frontend
        run: npm --prefix frontend run build
        shell: bash

      # ── download base model ──
      - name: Download Qwen2.5-0.5B base model
        run: |
          mkdir -p data/models
          # 0.5B ultra-lightweight — the only model bundled, to keep the
          # installer small and idle RAM/VRAM footprint low on low-end machines.
          # larger models can be downloaded in-app later if that flow is built.
          curl -L -o data/models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          ls -lh data/models/
        shell: bash

      # ── freeze python backend ──
      - name: Freeze backend (PyInstaller)
        run: |
          ADD_DATA="--add-data frontend/dist:frontend/dist"
          if ls data/models/*.gguf 1>/dev/null 2>&1; then
            ADD_DATA="$ADD_DATA --add-data data/models:data/models"
          fi
          pyinstaller --name thinkstack-api --onefile --clean \
            --hidden-import uvicorn \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import psutil \
            $ADD_DATA \
            main.py
        shell: bash

      # ── place sidecar (linux) ──
      - name: Place sidecar (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p src-tauri/bin
          cp dist/thinkstack-api "src-tauri/bin/thinkstack-api-x86_64-unknown-linux-gnu"
          chmod +x "src-tauri/bin/thinkstack-api-x86_64-unknown-linux-gnu"

      # ── place sidecar (macOS universal) ──
      - name: Place sidecar (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p src-tauri/bin
          # PyInstaller on macOS runner produces a native binary;
          # place it for both architectures so Tauri's universal build finds them
          cp dist/thinkstack-api "src-tauri/bin/thinkstack-api-aarch64-apple-darwin"
          cp dist/thinkstack-api "src-tauri/bin/thinkstack-api-x86_64-apple-darwin"
          chmod +x src-tauri/bin/thinkstack-api-*

      # ── place sidecar (windows) ──
      - name: Place sidecar (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri\bin | Out-Null
          Copy-Item dist\thinkstack-api.exe "src-tauri\bin\thinkstack-api-x86_64-pc-windows-msvc.exe"
        shell: powershell

      # ── build tauri (linux / windows) ──
      - name: Build Tauri app
        if: runner.os != 'macOS'
        run: npm run tauri build
        shell: bash

      # ── build tauri (macOS universal) ──
      - name: Build Tauri app (macOS universal)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target universal-apple-darwin
        shell: bash

      # ── collect artifacts ──
      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item src-tauri\target\release\bundle\msi\*.msi artifacts\ -ErrorAction SilentlyContinue
          Copy-Item src-tauri\target\release\bundle\nsis\*.exe artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts\
        shell: powershell

      # ── upload as workflow artifacts ──
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thinkstack-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  # ── create github release on tag push ──
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lhR all-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name || 'Manual Release' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: all-artifacts/*
