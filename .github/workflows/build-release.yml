name: Build & Release Desktop App

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_NAME: ThinkStack
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # bundle formats are chosen to handle the large (~3.7GB) payload:
        #   linux : deb + appimage  (rpm bundling hangs for hours on this size)
        #   windows: msi            (nsis/makensis hits a ~2GB mmap limit)
        #   macos : app + dmg       (app.tar.gz is the updater artifact)
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x86_64
            bundles: deb,appimage
          - os: macos-latest
            target: universal-apple-darwin
            label: macos-universal
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x86_64
            bundles: msi

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.label }})

    steps:
      # ── checkout ──
      - uses: actions/checkout@v4

      # ── system dependencies (linux only) ──
      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpango1.0-dev \
            build-essential

      # ── python ──
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch. the default torch wheel on linux/windows bundles the
          # full CUDA stack (nvidia/* ~2.7GB, torch ~1.2GB, triton ~0.7GB) that a
          # CPU-only app never uses. installing torch from the CPU index first
          # (~200MB) cuts roughly 4GB from the frozen build. macOS torch is CPU
          # by default, so it uses the normal index.
          if [ "$RUNNER_OS" = "macOS" ]; then
            pip install torch
          else
            pip install torch --index-url https://download.pytorch.org/whl/cpu
          fi
          pip install -r requirements.txt
          pip install pyinstaller
        shell: bash

      # ── node ──
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install Node dependencies
        run: |
          npm install
          npm --prefix frontend install
        shell: bash

      # ── rust ──
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ── build frontend ──
      - name: Build frontend
        run: npm --prefix frontend run build
        shell: bash

      # ── download base + analysis models ──
      # both are bundled (seeded into the user's models dir on first run):
      #   0.5B  → chat / search / paper-writer (light, fast)
      #   1.5B  → summarize / claims / gap-finder (0.5B emits unparseable json
      #           on these; the app routes them to 1.5B — see ollama_client.py)
      # this makes gap analysis work offline out of the box at the cost of a
      # larger installer. drop the 1.5B line to ship a smaller 0.5B-only build.
      - name: Download Qwen2.5 models
        run: |
          mkdir -p data/models
          curl -L -o data/models/qwen2.5-0.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct-GGUF/resolve/main/qwen2.5-0.5b-instruct-q4_k_m.gguf"
          curl -L -o data/models/qwen2.5-1.5b-instruct-q4_k_m.gguf \
            "https://huggingface.co/Qwen/Qwen2.5-1.5B-Instruct-GGUF/resolve/main/qwen2.5-1.5b-instruct-q4_k_m.gguf"
          ls -lh data/models/
        shell: bash

      # ── freeze python backend ──
      # --onedir (NOT --onefile): tauri.conf.json bundles dist/thinkstack-api/
      # as the "api/" resource dir, which lib.rs launches. onefile would
      # re-extract its multi-GB payload to a temp dir on every app launch.
      #
      # --collect-all llama_cpp / sentence_transformers are REQUIRED and were
      # validated locally: neither ships a PyInstaller hook, so without these the
      # frozen build silently omits llama_cpp's lib/*.so (chat + gap analysis
      # crash at model load) and sentence_transformers' package data (embeddings/
      # search break). torch/transformers/sklearn are collected by their own hooks.
      - name: Freeze backend (PyInstaller)
        run: |
          ADD_DATA="--add-data frontend/dist:frontend/dist"
          if ls data/models/*.gguf 1>/dev/null 2>&1; then
            ADD_DATA="$ADD_DATA --add-data data/models:data/models"
          fi
          pyinstaller --name thinkstack-api --onedir --clean --noconfirm \
            --hidden-import uvicorn \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols \
            --hidden-import uvicorn.protocols.http \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan \
            --hidden-import uvicorn.lifespan.on \
            --hidden-import psutil \
            --collect-all llama_cpp \
            --collect-all sentence_transformers \
            $ADD_DATA \
            main.py
          test -x dist/thinkstack-api/thinkstack-api || test -x dist/thinkstack-api/thinkstack-api.exe
        shell: bash

      # no sidecar placement needed: tauri.conf.json bundles the onedir
      # dist/thinkstack-api/ directly as the "api/" resource.

      # ── build tauri (linux / windows) ──
      # the signing env vars make the bundler emit signed updater artifacts
      # (.sig files) next to each installer, which the auto-updater verifies
      # against the pubkey in tauri.conf.json. store the private key + password
      # as repo secrets (see docs/RELEASE_GUIDE.md). absent secrets =>
      # unsigned build (installers still produced, just no working auto-update).
      - name: Build Tauri app
        if: runner.os != 'macOS'
        run: npm run tauri build -- --bundles ${{ matrix.bundles }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── build tauri (macOS universal) ──
      - name: Build Tauri app (macOS universal)
        if: runner.os == 'macOS'
        run: npm run tauri build -- --target universal-apple-darwin --bundles ${{ matrix.bundles }}
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── collect artifacts ──
      # *.sig are the updater signatures (present only when signing secrets are
      # set); the release job reads them to build latest.json. the AppImage /
      # .app.tar.gz / .msi are also the auto-updater's install targets.
      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/deb/*.deb artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage.sig artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Collect artifacts (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg artifacts/ 2>/dev/null || true
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz artifacts/ 2>/dev/null || true
          cp src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig artifacts/ 2>/dev/null || true
          ls -lh artifacts/

      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item src-tauri\target\release\bundle\msi\*.msi artifacts\ -ErrorAction SilentlyContinue
          Copy-Item src-tauri\target\release\bundle\msi\*.msi.sig artifacts\ -ErrorAction SilentlyContinue
          Get-ChildItem artifacts\
        shell: powershell

      # ── upload as workflow artifacts ──
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thinkstack-${{ matrix.label }}
          path: artifacts/*
          if-no-files-found: error

  # ── create github release on tag push ──
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: List release files
        run: ls -lhR all-artifacts/

      # ── build the auto-updater manifest (latest.json) ──
      # composes the signed manifest the desktop app polls. runs BEFORE the
      # stable-named copies below so it only sees the versioned files (which have
      # the matching .sig). skips cleanly if no .sig files are present.
      - name: Checkout (for the compose script)
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Compose updater manifest (latest.json)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          bash repo/scripts/compose-updater-manifest.sh \
            "$VERSION" all-artifacts "Rithesh077/ThinkStack" \
            > all-artifacts/latest.json || echo "no signed artifacts — skipping latest.json"
          [ -s all-artifacts/latest.json ] && cat all-artifacts/latest.json || rm -f all-artifacts/latest.json

      # ── stable-named copies (version-independent) ──
      # the landing page / vercel.json link to these fixed names via
      # releases/latest/download/, so download links never need a version bump
      # and always resolve to the newest release. the versioned files stay too
      # (the updater's latest.json points at those).
      - name: Create stable-named copies
        run: |
          cd all-artifacts
          cp ThinkStack_*_amd64.AppImage   ThinkStack-linux-x86_64.AppImage   2>/dev/null || true
          cp ThinkStack_*_amd64.deb        ThinkStack-linux-x86_64.deb        2>/dev/null || true
          cp ThinkStack_*_x64_en-US.msi    ThinkStack-windows-x86_64.msi      2>/dev/null || true
          cp ThinkStack_*_universal.dmg    ThinkStack-macos-universal.dmg     2>/dev/null || true
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name || 'Manual Release' }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: all-artifacts/*
