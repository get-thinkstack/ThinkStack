name: Release (beta)

# beta channel. push a prerelease tag (v0.2.0-beta.1) -- scripts/release.sh
# 0.2.0 --beta 1 -- and this publishes to the rolling "beta" prerelease. installed
# beta apps (built with the beta updater endpoint) self-update within the channel.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: 'beta version to build, e.g. 0.2.0-beta.1'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V='${{ inputs.version }}'
          else
            V="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build:
    needs: setup
    uses: ./.github/workflows/_build-desktop.yml
    with:
      channel: beta
      version: ${{ needs.setup.outputs.version }}
    # inherit passes every repo secret through, so adding a new signing/notary
    # secret later (enterprise, mobile) needs no edit here.
    secrets: inherit

  publish:
    needs: [setup, build]
    uses: ./.github/workflows/_publish-release.yml
    with:
      channel: beta
      version: ${{ needs.setup.outputs.version }}
