name: Release (auto on main)

# Merging beta into main IS the decision to release. This removes the manual
# step between that decision and users having the installers.
#
# The version is not invented here. It is whatever the beta channel has been
# testing, read from the rolling beta release. Promoting a number nobody
# validated would defeat the point of having a beta channel at all. If no beta
# exists, the version is inferred from the commits since the last stable tag
# using the same rules scripts/next_version.py applies everywhere else:
#
#     a fix      -> patch
#     a feature  -> minor
#     a breaking -> major
#
# Why this calls the reusable workflows directly instead of just pushing a tag:
# a tag pushed with GITHUB_TOKEN does NOT trigger other workflows, by design, so
# release-stable.yml would never fire. The tag is still created, because the tag
# is what the changelog, the updater manifest and `git describe` all refer to.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'override the derived version, e.g. 1.6.7'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

# Shares the queue with release-stable.yml: both publish the STABLE channel to
# the same release, so a separate group would let them run at once.
concurrency:
  group: release-stable
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # next_version.py reads the tag history

      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
          OVERRIDE: ${{ inputs.version }}
        shell: bash
        run: |
          if [ -n "$OVERRIDE" ]; then
            V="$OVERRIDE"
            echo "version overridden: $V"
          else
            # What beta has been testing, read from the beta VERSION TAGS.
            # Not from the rolling release's name: that lookup returns nothing
            # the moment the rolling tag is renamed, and the fallback below
            # would then infer a version that was never built.
            V="$(git tag -l 'v*-beta.*' | sed 's/^v//; s/-beta\..*//' \
                  | sort -V | tail -1 || true)"
            if [ -n "$V" ]; then
              echo "promoting the version beta validated: $V"
            else
              V="$(python3 scripts/next_version.py --infer --explain)"
              echo "no beta release found; inferred: $V"
            fi
          fi

          # Already released? Then this push to main carried no new release.
          # Re-tagging would change what a published version means.
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "v$V already exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Create the tag
        if: steps.v.outputs.release == 'true'
        shell: bash
        run: |
          V='${{ steps.v.outputs.version }}'
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "ThinkStack v$V"
          git push origin "v$V"
          echo "tagged v$V"

  build:
    needs: decide
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/_build-desktop.yml
    with:
      channel: stable
      version: ${{ needs.decide.outputs.version }}
    secrets: inherit

  publish:
    needs: [decide, build]
    if: needs.decide.outputs.release == 'true'
    uses: ./.github/workflows/_publish-release.yml
    with:
      channel: stable
      version: ${{ needs.decide.outputs.version }}
    secrets: inherit
