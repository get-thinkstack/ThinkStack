name: CI

# the quality gate. runs on every PR and on pushes to the main branches, before
# anything can be tagged for release. this is what stops a broken commit (a
# syntax error, an undefined name, a failing test) from ever reaching a release
# tag -- exactly the class of bug that shipped before this existed.
#
# structured as independent jobs so it scales: a future mobile target adds a
# `mobile-check` job, an enterprise variant adds its own, without touching these.

on:
  pull_request:
  push:
    # the three long-lived branches: main = production, dev = beta, demo = binary
    # validation. master kept while it remains the repo default.
    branches: [main, master, dev, demo]
  workflow_dispatch:

# a newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- workflows: authoritative GitHub Actions validation --
  # actionlint is what actually mirrors GitHub's own workflow validation. it is
  # the source of truth for "are the workflows correct" -- the VSCode extension's
  # diagnostics on local reusable workflows are known false positives, so this
  # job (not the editor) is what gates workflow changes.
  actionlint:
    runs-on: ubuntu-latest
    name: Workflows (actionlint)
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # -- python: real-bug lint (ruff E9 + pyflakes) --
  python-lint:
    runs-on: ubuntu-latest
    name: Lint (ruff)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format github .

  # -- python: unit tests (lean deps -- no torch/llama compile) --
  python-test:
    runs-on: ubuntu-latest
    name: Test (pytest)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run unit tests
        run: pytest --cov=domain --cov=infrastructure --cov=config --cov-report=term-missing

  # -- rust: the tauri shell compiles + is formatted --
  # validates src-tauri (incl. diagnosis.rs and the sysinfo dep) without doing a
  # full release build. `cargo check` proves it compiles; fmt keeps it tidy.
  rust-check:
    runs-on: ubuntu-latest
    name: Rust (check + fmt)
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libpango1.0-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # tauri.conf.json bundles ../dist/thinkstack-api/ as the "api/" resource,
      # and tauri's build script fails if that path is missing. this job checks
      # the Rust code only -- it deliberately does not freeze the multi-GB python
      # backend -- so stand in an empty dir to satisfy the resource check. the
      # real bundle is produced by the release workflow (_build-desktop.yml).
      - name: Stub backend resource dir
        run: mkdir -p dist/thinkstack-api

      - name: Compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Clippy (non-blocking)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml || true
