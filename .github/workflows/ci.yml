name: CI

# the quality gate. runs on every PR and on pushes to the main branches, before
# anything can be tagged for release. this is what stops a broken commit (a
# syntax error, an undefined name, a failing test) from ever reaching a release
# tag -- exactly the class of bug that shipped before this existed.
#
# structured as independent jobs so it scales: a future mobile target adds a
# `mobile-check` job, an enterprise variant adds its own, without touching these.

on:
  pull_request:
  push:
    # the three long-lived branches:
    #   main = production (what gets tagged for a stable release)
    #   beta = integration; installers are bundled and tested from here
    #   dev  = day-to-day work and experiments
    branches: [main, master, beta, dev]
  workflow_dispatch:

# a newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- which parts of the repo actually changed? --
  # Every job below is gated on this, so a push runs only the checks its changes
  # can affect: editing a doc does not compile Rust, and a frontend-only change
  # does not run the Python suite. Protected branches (main/beta) ignore the
  # scoping and run everything, because that is what gets tagged and shipped.
  #
  # Plain git rather than a third-party action: no extra dependency, and the
  # comparison base is explicit.
  changes:
    runs-on: ubuntu-latest
    name: Detect changes
    outputs:
      python: ${{ steps.f.outputs.python }}
      rust: ${{ steps.f.outputs.rust }}
      workflows: ${{ steps.f.outputs.workflows }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: f
        env:
          # on a PR, compare against the target branch; on a push, against the
          # commit the branch was at before it.
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --quiet origin "$BASE_REF"
            RANGE="origin/$BASE_REF...HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE=""   # first push / unknown base -> treat everything as changed
          fi

          if [ -z "$RANGE" ]; then
            CHANGED="$(git ls-files)"
          else
            CHANGED="$(git diff --name-only "$RANGE")"
          fi
          echo "range: ${RANGE:-<all files>}"
          echo "$CHANGED" | head -40

          # main/beta are what get shipped: never skip a check there.
          case "${{ github.ref_name }}" in
            main|master|beta) FORCE=1 ;;
            *)                FORCE=0 ;;
          esac

          emit() {  # name, regex
            if [ "$FORCE" = "1" ] || echo "$CHANGED" | grep -qE "$2"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
            else
              echo "$1=false" >> "$GITHUB_OUTPUT"
            fi
          }
          emit python    '\.py$|requirements.*\.txt|pytest\.ini|ruff\.toml'
          emit rust      '^src-tauri/'
          emit workflows '^\.github/workflows/'
          emit frontend  '^frontend/'

  # -- workflows: authoritative GitHub Actions validation --
  # actionlint is what actually mirrors GitHub's own workflow validation. it is
  # the source of truth for "are the workflows correct" -- the VSCode extension's
  # diagnostics on local reusable workflows are known false positives, so this
  # job (not the editor) is what gates workflow changes.
  actionlint:
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    name: Workflows (actionlint)
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          # The shellcheck exclusions MUST match scripts/preflight.sh exactly.
          #
          # actionlint shells out to whatever shellcheck is on the machine, and
          # the runner's is older than a current developer install. shellcheck
          # 0.11 stopped reporting SC2015 when the `||` branch exits; the
          # runner's still reports it. That is a failure no one can reproduce
          # locally -- it cost a red CI on a workflow that linted clean here.
          # Pinning the excluded codes on both sides removes the skew.
          ./actionlint -color -shellcheck "shellcheck -e SC1091,SC2015"

  # -- python: real-bug lint (ruff E9 + pyflakes) --
  python-lint:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    name: Lint (ruff)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: ruff check
        run: ruff check --output-format github .

  # -- python: unit tests (lean deps -- no torch/llama compile) --
  python-test:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    name: Test (pytest)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install test dependencies
        run: pip install -r requirements-test.txt
      - name: Run unit tests
        run: pytest --cov=domain --cov=infrastructure --cov=config --cov-report=term-missing

  # -- rust: the tauri shell compiles + is formatted --
  # validates src-tauri (incl. diagnosis.rs and the sysinfo dep) without doing a
  # full release build. `cargo check` proves it compiles; fmt keeps it tidy.
  rust-check:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    name: Rust (check + fmt)
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libpango1.0-dev build-essential
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # tauri.conf.json bundles ../dist/thinkstack-api/ as the "api/" resource,
      # and tauri's build script fails if that path is missing. this job checks
      # the Rust code only -- it deliberately does not freeze the multi-GB python
      # backend -- so stand in an empty dir to satisfy the resource check. the
      # real bundle is produced by the release workflow (_build-desktop.yml).
      - name: Stub backend resource dir
        run: mkdir -p dist/thinkstack-api

      - name: Compile check
        run: cargo check --manifest-path src-tauri/Cargo.toml
      - name: Clippy (non-blocking)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml || true

  # -- the single check to require in branch protection --
  # Because the jobs above are skipped when irrelevant, requiring them directly
  # would leave a PR pending forever on a check that never runs (GitHub does not
  # resolve a required-but-skipped context). This one always runs and passes only
  # when nothing that DID run failed, so "skipped" and "passed" are both green
  # while any real failure is red.
  # -- frontend: the react app is linted, tested and must build --
  # This job did not exist. `changes` already emitted a `frontend` flag, but
  # nothing consumed it, so every UI change reached users unchecked -- which is
  # how a duplicate "Run summarize" button and an updater that reported no
  # progress on a 900 MB download both shipped.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    name: Frontend (lint + test + build)
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20. jsdom (the vitest environment) declares
          # engines.node ^22.22.2 || ^24.15.0 || >=26, so on 20 it installs and
          # then fails to load -- which passed locally on node 22 and failed
          # only in CI. Keep this in step with frontend/package.json engines.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      # The build is a test in its own right: it is the step that actually
      # produces what ships, and a broken import passes lint but fails here.
      - name: Build
        run: npm run build

  ci-ok:
    needs: [changes, actionlint, python-lint, python-test, rust-check, frontend]
    if: always()
    runs-on: ubuntu-latest
    name: CI OK
    steps:
      - name: Verify no job failed
        run: |
          RESULTS="${{ join(needs.*.result, ' ') }}"
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job did not pass ($r)"; exit 1 ;;
            esac
          done
          echo "all checks accounted for"
