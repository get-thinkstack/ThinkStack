name: Deploy landing page

# Publishes BOTH channel pages to the single GitHub Pages site this repo gets:
#
#   /        <- landing.html from main. The public page. Its download buttons
#               use /releases/latest/download/, which GitHub always resolves to
#               the newest STABLE release.
#   /beta/   <- landing.html from the beta branch, rewritten to point at the
#               rolling `beta` release. For invited testers. Not linked from /.
#
# Why a subpath and not a second site: a repository gets exactly one GitHub Pages
# site. A subpath is the only way to serve two channels from this repo, and it
# has a real advantage -- the beta page is GENERATED from the same landing.html
# rather than being a second copy, so the two channels cannot drift apart.
#
# Why a plain string swap and not an API lookup: GitHub resolves
# /releases/latest/ to the newest STABLE release and offers no prerelease
# equivalent, but release.config.json publishes beta under a ROLLING tag, so
# /releases/download/<rolling_tag>/ is permanent. An earlier version queried
# the API for "the newest prerelease" and picked up NIGHTLY -- also a
# prerelease, republished daily -- and served nightly builds from the beta page.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source:
# "GitHub Actions".
#
# Triggers: a push to main or beta touching landing.html, a published release,
# or by hand from the Actions tab. Both pages are rebuilt on every run.

on:
  push:
    # beta is included so a landing-page change on the beta branch reaches
    # testers without waiting for a release. Both pages are rebuilt either way:
    # the job always assembles / from main and /beta/ from beta, so a deploy
    # triggered by one branch can never publish a stale copy of the other.
    branches: [main, master, beta]
    paths: ['landing.html', '.github/workflows/deploy-pages.yml']
  release:
    # a new prerelease changes which tag /beta/ must point at
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; don't cancel an in-progress deploy
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # the deploy-pages action publishes to the github-pages environment on its
    # own; declaring `environment: github-pages` here is optional and some editor
    # schemas wrongly flag the name, so it is omitted. add it back if you enable
    # environment protection rules.
    steps:
      # -- stable page, from the default branch --
      # The ref is pinned explicitly. A bare checkout takes the triggering ref,
      # so a push to beta (or a beta release) would publish beta's landing.html
      # as the PUBLIC page -- shipping pre-release download links to everyone.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Assemble the stable page
        run: |
          mkdir -p _site
          cp landing.html _site/index.html

      # -- beta page, from the beta branch --
      # Checked out separately so testers get the beta branch's own landing.html.
      # That is the point of a beta channel: a page change is validated by real
      # people on /beta/ before it reaches the public page.
      - name: Fetch the beta branch
        id: beta_src
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: beta
          path: .beta-src

      - name: Assemble the beta page
        shell: bash
        run: |
          SRC=.beta-src/landing.html
          if [ ! -f "$SRC" ]; then
            echo "no beta branch checkout; skipping /beta/"
            exit 0
          fi

          mkdir -p _site/beta

          # The beta channel publishes to a ROLLING tag: every beta build
          # republishes the same release, so this URL is permanent and needs no
          # lookup. An earlier version queried the API for "the newest
          # prerelease" and picked up NIGHTLY, which is also a prerelease and is
          # republished daily -- serving nightly builds from the beta page.
          #
          # The tag name is read from release.config.json rather than written
          # here, so renaming a channel stays a one-line config edit. It was
          # hardcoded as "beta", which is also a branch name; see the
          # $comment_rolling note in that file for why it no longer is.
          ROLLING="$(jq -r '.channels.beta.rolling_tag' release.config.json)"
          [ -n "$ROLLING" ] && [ "$ROLLING" != "null" ] \
            || { echo "::error::no rolling_tag for the beta channel"; exit 1; }
          sed -e "s#/releases/latest/download/#/releases/download/${ROLLING}/#g" "$SRC" \
            > _site/beta/index.html

          # Make the channel unmistakable. A tester who cannot tell beta from
          # stable will file bugs against the wrong build.
          python3 - <<'PY'
          import pathlib
          banner = (
              '<div style="position:sticky;top:0;z-index:9999;background:#95ff00;'
              'color:#0a0a0a;padding:.6rem 1rem;text-align:center;'
              'font:600 14px/1.5 system-ui,-apple-system,sans-serif">'
              'Beta channel - pre-release software for invited testers. '
              '<a href="../" style="color:#0a0a0a">Get the stable release instead</a></div>'
          )
          p = pathlib.Path("_site/beta/index.html")
          s = p.read_text(encoding="utf-8")
          i = s.find("<body>")
          if i != -1:
              i += len("<body>")
              s = s[:i] + banner + s[i:]
          p.write_text(s, encoding="utf-8")
          print("banner injected")
          PY

          # Never hand testers a page whose download buttons serve stable.
          # Checked on href targets only: landing.html also mentions the string
          # in a JS comment, which is not a link.
          if grep -qE 'href="[^"]*/releases/latest/download/' _site/beta/index.html; then
            echo "::error::/beta/ still has stable download links - the rewrite did not apply"
            exit 1
          fi
          echo "beta links: $(grep -c "/releases/download/${ROLLING}/" _site/beta/index.html)"

      - name: Keep the beta checkout out of the published site
        run: rm -rf .beta-src

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
