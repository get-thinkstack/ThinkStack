name: Sync doc facts

# Keeps the DETERMINISTIC numbers in documentation correct: version, test count,
# endpoint count, module and line counts. Prose is written by people (or by a
# model); counts are derived from the repository and go stale silently. This
# repo has already shipped "207 tests" long after the suite reached 308, and a
# README describing a preview that had been deleted.
#
# Only text between markers is touched:
#   <!-- autodoc:tests -->308 tests across 23 modules<!-- /autodoc -->
# Everything else is left exactly as written, so this can never overwrite an
# edit.
#
# No infinite loop is possible: the commit this makes triggers another run,
# which finds nothing stale and commits nothing.

on:
  push:
    branches: [dev, beta, main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # A push made by this workflow must not start another round of work.
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      # The test count comes from collecting the suite, which needs the
      # application's imports to resolve.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-test.txt

      - name: Refresh the facts
        run: python scripts/update_docs.py

      - name: Commit if anything changed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "documentation facts already current"
            exit 0
          fi

          echo "--- what changed ---"
          git --no-pager diff --stat

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: refresh derived facts

          Version, test count, endpoint count and module totals, regenerated
          from the repository by scripts/update_docs.py. Only text between
          autodoc markers is touched; prose is untouched."
          git push origin "HEAD:${GITHUB_REF_NAME}"
